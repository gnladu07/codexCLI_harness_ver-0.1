services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: member_management
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME to a non-root MySQL user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
