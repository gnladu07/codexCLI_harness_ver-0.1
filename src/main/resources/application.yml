server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: member-management
  profiles:
    default: local
  datasource:
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
